name: Weather forecast history (ECMWF IFS ENS, dynamical.org)

# ECMWF IFS ENS archived forecasts (dynamical.org, CC BY 4.0 + ECMWF Terms of Use; attribution "ECMWF IFS ENS forecast
# data processed by dynamical.org from ECMWF Open Data"), 00 UTC runs from 15 Oct 2020, leads 0-96 h, 51 members:
# the 37 weather points and area averages (country masks, IT-North, Swiss Alps, German offshore) with the member
# spread -> HPFC-data data/weather_fc/history_ens/. Resumable, up to 5 h per run; daily at 04:23 UTC until complete,
# then it appends the new runs (00 UTC run published ~08:00 UTC; the next day's run picks it up).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | history"
        required: false
        default: "history"
      start:
        description: "first init date (history)"
        required: false
        default: "2020-10-15"

permissions:
  contents: read

concurrency:
  group: weather_ecmwf_ens
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATA_ROOT: ${{ github.workspace }}/data-repo
      MODE: ${{ github.event.inputs.mode || 'history' }}
      START: ${{ github.event.inputs.start || '2020-10-15' }}
      DIRS: data/weather_fc/history_ens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonnyForecast/HPFC-data
          token: ${{ secrets.HPFC_DATA_TOKEN }}
          path: data-repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "dynamical-catalog>=0.8.0" "xarray>=2025.1.2" "zarr>=3.0.8" "dask[array]" fsspec aiohttp requests pandas regionmask geopandas pooch
      - name: Collect and push
        working-directory: data-repo
        run: |
          git config user.name "collector-public"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "inspect" ]; then python $GITHUB_WORKSPACE/collectors/collect_ecmwf_ens_history.py inspect; exit $?; fi
          rc=0
          python $GITHUB_WORKSPACE/collectors/collect_ecmwf_ens_history.py history --start "$START" || rc=1
          for d in $DIRS; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "nothing new"; exit $rc; fi
          git commit -q -m "ECMWF ENS weather history $(date -u +%Y-%m-%d) (collector-public)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then echo "pushed"; break; fi
            sleep 15
          done
          exit $rc
