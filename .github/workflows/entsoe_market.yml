name: ENTSO-E outages, outage revisions and Swiss border flows

# ENTSO-E (secret ENTSOE_TOKEN): unavailability of generation/production units in CH and FR with every revision and its
# publication time, older revisions per outage, physical flows on the Swiss borders, EXAA (10:15 CET) auction prices AT/DE. Daily 05:41 UTC, before the
# 07:00 Swiss forecast issue; flows on Saturdays. Each part is committed as soon as it is done.
# Code: this public repo. Data: written into the private data repo (checked out with the HPFC_DATA_TOKEN secret,
# write access to that repo only) and pushed there. Logs show counts and dates only.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      parts:
        description: "flows ntc outages revisions exaa reservoirs (empty = daily default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: entsoe_market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_ROOT: ${{ github.workspace }}/data-repo
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      PARTS: ${{ github.event.inputs.parts }}
      DIRS: data/entsoe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonnyForecast/HPFC-data
          token: ${{ secrets.HPFC_DATA_TOKEN }}
          path: data-repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas
      - name: Collect and push
        working-directory: data-repo
        run: |
          git config user.name "collector-public"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            for d in $DIRS; do [ -e "$d" ] && git add "$d"; done
            if git diff --cached --quiet; then echo "nothing new ($1)"; return 0; fi
            git commit -q -m "$1 $(date -u +%Y-%m-%d) (collector-public)"
            for i in 1 2 3 4 5; do
              if git pull -q --rebase && git push -q; then echo "pushed $1"; return 0; fi
              sleep 15
            done
            echo "::error::could not push $1"; return 1
          }
          C=$GITHUB_WORKSPACE/collectors
          rc=0
          want() { [ -z "$PARTS" ] || echo " $PARTS " | grep -q " $1 "; }
          if { [ -z "$PARTS" ] && [ "$(date -u +%u)" = 6 ]; } || echo " $PARTS " | grep -q " flows "; then
            python $C/collect_entsoe_market.py flows || rc=1; commit "entsoe flows" || rc=1
          fi
          if echo " $PARTS " | grep -q " ntc "; then python $C/collect_entsoe_market.py ntc || rc=1; commit "entsoe ntc" || rc=1; fi
          if want outages; then
            for z in CH FR; do python $C/collect_entsoe_market.py outages --zone $z || rc=1; commit "entsoe outages $z" || rc=1; done
          fi
          if { [ -z "$PARTS" ] && [ "$(date -u +%u)" = 4 ]; } || echo " $PARTS " | grep -q " reservoirs "; then
            python $C/collect_entsoe_reservoirs.py || rc=1; commit "entsoe reservoirs" || rc=1
          fi
          if want exaa; then python $C/collect_entsoe_exaa.py || rc=1; commit "entsoe exaa" || rc=1; fi
          if want revisions; then
            REV_MAX_MIN=150 python $C/collect_entsoe_market.py revisions || rc=1; commit "entsoe outage revisions" || rc=1
          fi
          exit $rc
