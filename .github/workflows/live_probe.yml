name: Live data probe
# Checks what the 07:00 live run can fetch (Open-Meteo previous-runs lead 2 for the next day). Manual, and at
# 05:31 UTC (06:31 CET) until the live run exists.
on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonnyForecast/HPFC-data
          token: ${{ secrets.HPFC_DATA_TOKEN }}
          path: data-repo
          fetch-depth: 1
          sparse-checkout: data/weather_fc/points.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas requests
      - run: python probes/live_weather_probe.py
