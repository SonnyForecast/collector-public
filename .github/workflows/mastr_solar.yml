name: MaStR German PV fleet (monthly capacity by curtailability attributes)

# Marktstammdatenregister bulk export (Bundesnetzagentur, dl-de/by-2-0) via open-mastr; only the solar units are
# parsed, aggregated to monthly installed capacity (collectors/collect_mastr_solar.py) and pushed to the private data
# repo as data/mastr/. The raw export (several GB) stays on the runner. Monthly, 3rd at 03:17 UTC.
on:
  schedule:
    - cron: "17 3 3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mastr
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATA_ROOT: ${{ github.workspace }}/data-repo
      DIRS: data/mastr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonnyForecast/HPFC-data
          token: ${{ secrets.HPFC_DATA_TOKEN }}
          path: data-repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "open-mastr>=1.1" pandas
      - name: Free disk space for the export
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - name: Collect and push
        working-directory: data-repo
        run: |
          git config user.name "collector-public"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python $GITHUB_WORKSPACE/collectors/collect_mastr_solar.py
          git add $DIRS
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "mastr solar $(date -u +%Y-%m-%d) (collector-public)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then echo "pushed"; exit 0; fi
            sleep 15
          done
          echo "::error::could not push"; exit 1
