name: EEX day and weekend futures (CH DE FR AT IT)
# Daily archive of EEX day futures settlements -> HPFC-data data/eex/day_futures.csv. EEX keeps each contract ~45 days,
# so a late or missed run costs nothing as long as one run lands within ~30 days (12-day look-back by default).
on:
  schedule:
    - cron: "29 22 * * 1-5"
  workflow_dispatch:
    inputs:
      days: {description: "days to look back (46 = whole public window)", required: false, default: "12"}
permissions:
  contents: read
concurrency:
  group: eex_day
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_ROOT: ${{ github.workspace }}/data-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonnyForecast/HPFC-data
          token: ${{ secrets.HPFC_DATA_TOKEN }}
          path: data-repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - name: Collect and push
        working-directory: data-repo
        run: |
          git config user.name "collector-public"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python $GITHUB_WORKSPACE/collectors/collect_eex_day.py --days "${{ github.event.inputs.days || '12' }}"
          git add data/eex/day_futures.csv data/eex/weekend_futures.csv
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "eex day futures $(date -u +%Y-%m-%d) (collector-public)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then echo pushed; exit 0; fi
            sleep 15
          done
          echo "::error::could not push"; exit 1
